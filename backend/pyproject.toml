[project]
name = "slipslopes-backend"
version = "1.0.0"
description = "SlipSlopes API and worker: contractual liquidity intelligence"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.2",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "celery[redis]>=5.4,<6",
    "redis>=5,<8",
    "pymupdf>=1.26,<2",
    "pytesseract>=0.3.10,<1",
    "pillow>=10",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "anthropic>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP045", "B904"]  # FastAPI Depends defaults; Optional[] kept for readability

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/engine/**" = ["E501", "B905", "UP042"]  # original engine code: long regex patterns

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["alembic/versions"]

