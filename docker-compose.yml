# Local development services. The API, worker, auth gateway and frontend run on the host
# (see docs/LOCAL_DEVELOPMENT.md). Credentials here are local-only placeholders.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres-local-only
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:                       # captures confirmation and password-recovery emails
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  auth:                          # Supabase Auth (GoTrue); exposed under /auth/v1 by scripts/dev_auth_proxy.py
    image: supabase/gotrue:v2.177.0
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["9999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:auth-local-only@postgres:5432/slipslopes_auth?sslmode=disable
      DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_JWT_SECRET: local-dev-jwt-secret-at-least-32-characters-long
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@slipslopes.local
      GOTRUE_SMTP_SENDER_NAME: SlipSlopes
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

volumes:
  pgdata:
